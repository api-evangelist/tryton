# Tryton integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in tryton-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: tryton-mozilla-firefox-add-ons-amo
  label: Mozilla Firefox Add-ons (AMO)
  partner_name: Mozilla Firefox Add-ons (AMO)
  category: browser extension (Firefox Add-ons)
  type: marketplace
  marketplace: firefox-add-ons
  channel: partner-built
  evidence: https://addons.mozilla.org/en-US/firefox/addon/tryton-chronos/
  source: edge
  relationship: platform-app
  contract_reference:
    register: 'Firefox Add-ons (addons.mozilla.org public API v5 search: authors, homepage, support_url)'
    spec_file: null
    role: firefox-add-on-publisher
    registered_name: Tryton, Cédric Krier
    register_id: https://addons.mozilla.org/api/v5/addons/addon/tryton-chronos/
    matched_domain: tryton.org
    matched_by: domain
    matched_name: Tryton
    builder: publisher
    signal_note: ONE edge per provider for the store; listing alone = participation. The AMO author name (builder
      publisher) or homepage + support_url both on the provider's domain (builder domain-attested) identifies it;
      extension / user counts are context, never counted. No Mozilla repo in all/*, so no platform-side edge exists
      to mirror.
    detected_by: sweep-browser-extension-stores.py
    detected: '2026-10-21'
  status: not-a-workflow
  arazzo: null
