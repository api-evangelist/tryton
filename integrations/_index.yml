    spec_file: null
    role: flathub-verified-publisher
    registered_name: The Tryton Project
    register_id: https://flathub.org/api/v2/appstream/org.tryton.Tryton-70
    matched_domain: tryton.org
    matched_by: domain
    matched_name: The Tryton Project
    verification_method: website
